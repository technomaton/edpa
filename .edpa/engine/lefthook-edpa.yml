# EDPA-managed lefthook hooks — DO NOT EDIT.
# Vendored from the plugin into .edpa/engine/lefthook-edpa.yml on every session
# (update_engine.sh), so hook changes propagate on `/plugin update` without a
# re-paste. Wire it up ONCE by adding to your own lefthook.yml:
#
#   extends:
#     - .edpa/engine/lefthook-edpa.yml
#
# then run `lefthook install`. Command names are namespaced (edpa-*) so lefthook
# merges them into any pre-commit you already have instead of replacing it.
#
# On a name collision this fragment WINS — a command you define under an edpa-*
# name in your own lefthook.yml is replaced by the version below, silently.
# Migrating from the old paste-in snippet is therefore a no-op (its run: lines
# are identical to these), but a hand-rolled edpa-* command of your own will
# stop running while still looking active in your config.
# pre-push reads its refs on stdin, so its command sets `use_stdin: true` —
# without it lefthook holds a pseudo-TTY open and hangs the push.
pre-commit:
  commands:
    edpa-id-safety:
      run: sh .edpa/engine/scripts/hooks/pre-commit-id-safety
commit-msg:
  commands:
    edpa-ticket-attached:
      run: sh .edpa/engine/scripts/hooks/commit-msg-ticket-attached {1}
post-commit:
  commands:
    edpa-evidence:
      run: sh .edpa/engine/scripts/hooks/post-commit-evidence
pre-push:
  commands:
    edpa-id-safety:
      run: sh .edpa/engine/scripts/hooks/pre-push-id-safety {1} {2}
      use_stdin: true
