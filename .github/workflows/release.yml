name: Release

# Triggered when a `v*` tag is pushed. Builds edpa-plugin.tar.gz from
# the plugin/ tree (plus tools/pi-planning, which install.sh's
# --with-server probe expects in the payload) and publishes a GitHub
# Release with that asset attached. Removes the manual
# `tar -czf ... && gh release create ...` step from the maintainer's
# hand and guarantees byte-identical asset layout regardless of who
# tagged.
#
# Maintainer flow becomes: bump versions, update CHANGELOG, commit
# release: vX.Y.Z, then `git tag vX.Y.Z && git push --tags`. The
# workflow does the rest.
#
# "Bump versions" = update BOTH files together so the site mirrors
# the engine release in product copy:
#   - plugin/.claude-plugin/plugin.json   (engine, single source of truth)
#   - web/package.json                    (mirror, drives Vercel deploys)

on:
  push:
    tags:
      - 'v*'
  # Manual re-run path for repairing a release whose asset upload was
  # interrupted, or back-filling assets onto a tag that was created
  # before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build the asset for, e.g. v1.5.0-beta'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Publishing whatever the tag points at with zero validation is how a
      # mislabeled asset ships: install.sh pins .edpa/engine/VERSION from the
      # payload's plugin.json, so tagging v2.13.0 on a tree still stamped
      # 2.12.1 gives every consumer a wrong pin. Strict only on tag pushes —
      # the workflow_dispatch back-fill path must keep working for historical
      # tags (e.g. v1.23.1-final, whose plugin.json says 1.23.1).
      - name: Validate tag matches plugin.json version
        run: |
          PKG=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          if [ "$PKG" != "${{ steps.tag.outputs.version }}" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::tag ${{ steps.tag.outputs.tag }} != plugin.json $PKG — run scripts/bump_version.py, commit, retag"
              exit 1
            else
              echo "::warning::back-fill mismatch: tag ${{ steps.tag.outputs.tag }} vs plugin.json $PKG"
            fi
          fi

      - name: Set up Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test.yml triggers on branch pushes and PRs only — a tag push matches
      # neither, so without this step a release publishes an untested commit.
      # Skipped on workflow_dispatch back-fills: historical tags may carry
      # suites that no longer pass on current runners.
      - name: Run test suite at tag
        if: github.event_name == 'push'
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ -m "not e2e" -q --tb=short

      - name: Build edpa-plugin.tar.gz
        run: |
          tar --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.DS_Store' \
              --exclude='dist' \
              --exclude='node_modules' \
              -czf edpa-plugin.tar.gz plugin/ tools/pi-planning
          ls -lh edpa-plugin.tar.gz
          echo "Contents (top level):"
          tar -tzf edpa-plugin.tar.gz | head -10

      - name: Extract CHANGELOG section for ${{ steps.tag.outputs.version }}
        run: |
          python3 - "${{ steps.tag.outputs.version }}" > release-notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          # Match `## {version} — date` heading through the next `## ` heading.
          pattern = rf'(## {re.escape(version)}\b.*?)(?=\n## )'
          m = re.search(pattern, text, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              # No CHANGELOG entry yet — emit a stub so gh release create
              # doesn't choke on an empty file. Maintainer should backfill.
              print(f"# {version}\n\n_CHANGELOG entry pending._")
          PY
          if grep -q '_CHANGELOG entry pending._' release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${{ steps.tag.outputs.version }} — publishing stub release notes; backfill CHANGELOG.md"
          fi
          echo "--- release-notes.md preview ---"
          head -20 release-notes.md

      - name: Decide prerelease flag
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Match the historical convention: every -alpha/-beta/-rc tag
          # is a prerelease. Stable tags (no suffix) are full releases.
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Tag already published — just refresh the asset (handles
            # workflow_dispatch back-fill and interrupted upload retries).
            echo "Release $TAG exists — refreshing asset only."
            gh release upload "$TAG" edpa-plugin.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" edpa-plugin.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              ${{ steps.prerelease.outputs.flag }} \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
