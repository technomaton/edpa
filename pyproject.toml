# Dev-only tool configuration.
#
# Intentionally NO [project] or [build-system] table: the engine ships as
# loose vendored scripts (plugin/edpa/scripts/) and the repo must stay
# non-pip-installable. Keep this file [tool.*]-only.

[tool.pytest.ini_options]
addopts = '-m "not e2e"'
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests against real GitHub (opt-in: pytest -m e2e). Requires EDPA_E2E_REPO env var and gh auth.",
    "skill_e2e: skill-driven E2E via headless `claude -p` (opt-in: EDPA_SKILL_E2E=1 + claude on PATH). Spawns real Claude Code — API cost, minutes of wall time. Run: EDPA_SKILL_E2E=1 pytest -m skill_e2e.",
]

[tool.ruff]
# .edpa/engine/ is a vendored copy of plugin/edpa/scripts/ (regenerated by
# project_setup.py, never edited by hand) — lint the source, not the copy.
extend-exclude = [".edpa"]

[tool.ruff.lint]
# Errors-only gate (enforced by the `ruff` job in .github/workflows/test.yml):
#   E9  — syntax errors / unreadable source
#   F63 — invalid comparisons and assertion misuse
#   F7  — statements in an invalid context (e.g. return outside function)
#   F82 — undefined names
# Deliberately NO style, import-order or formatting rules: the engine must
# never need mass edits just to keep a linter quiet. Widen the set only with
# a rule-by-rule case, never wholesale.
select = ["E9", "F63", "F7", "F82"]
